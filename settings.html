<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置｜倒带之前</title><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/settings.css"></head><body class="settings"><div class="settings-page"><div class="settings-top"><a href="index.html" style="color:inherit">← 返回白鸽音像</a></div><main class="settings-main"><h1>设置</h1><section class="settings-section"><h2>存档</h2><div><p>整理记录保存在当前浏览器中。刷新、前进或后退不会清空已经保存的内容。</p><p class="meta">如果换浏览器或清除网站数据，记录不会自动带过去。</p></div></section><section class="settings-section"><h2>操作</h2><div><ul><li>主要图片均有文字说明，关键信息不只靠颜色表达。</li><li>店内位置草图既可拖动，也可“先选名称、再点位置”。</li><li>照片联系表使用“选中照片→前移/后移”，触屏无需精细拖拽。</li><li>全流程不需要视频、声音或联网服务。</li></ul></div></section><section class="settings-section"><h2>重新开始</h2><div><p>会清除本机的整理记录、提示使用记录和尚未保存的整理草稿，然后从闭店首页重新开始。</p><button class="plain-button danger" id="resetBtn" type="button">重新开始</button></div></section></main></div><div class="modal-backdrop" id="resetModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="resetTitle"><h2 id="resetTitle">清除本机整理记录？</h2><p>确认后会回到闭店首页，从U-04首次发现状态重新开始。</p><div class="modal-actions"><button class="plain-button" id="cancelReset">取消</button><button class="plain-button danger" id="confirmReset">确认清除</button></div></div></div><script src="assets/game.js"></script><script>
const m=document.getElementById('resetModal'),openBtn=document.getElementById('resetBtn'),cancelBtn=document.getElementById('cancelReset'),confirmBtn=document.getElementById('confirmReset');
let lastFocus=null;function openReset(){lastFocus=document.activeElement;m.classList.add('open');cancelBtn.focus()}function closeReset(){m.classList.remove('open');if(lastFocus)lastFocus.focus()}
openBtn.onclick=openReset;cancelBtn.onclick=closeReset;confirmBtn.onclick=()=>Game.reset();m.addEventListener('click',e=>{if(e.target===m)closeReset()});document.addEventListener('keydown',e=>{if(!m.classList.contains('open'))return;if(e.key==='Escape'){e.preventDefault();closeReset();return}if(e.key==='Tab'){const list=[cancelBtn,confirmBtn],i=list.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();confirmBtn.focus()}else if(!e.shiftKey&&i===1){e.preventDefault();cancelBtn.focus()}}});
</script></body></html>
