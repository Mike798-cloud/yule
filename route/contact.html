<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>本机照片联系表｜U-04整理台</title><link href="../assets/css/base.css" rel="stylesheet"/><link href="../assets/css/route.css" rel="stylesheet"/></head><body class="route-page" data-puzzles="p7"><div class="viewerapp"><header class="bar"><h1>U-04 / SD卡只读副本</h1><div class="meta">8张JPEG / 原卡只读</div></header><nav class="tools"><a data-return-home="" href="../index.html">关闭SD卡索引</a><a href="index.html">目录</a><a class="current" href="contact.html">本机联系表</a><a href="viewer.html">照片查看</a><a data-disc="accident" hidden href="road-notice.html">道路资料</a><span class="tool-disabled" data-not-disc="accident">道路资料</span><a data-disc="accident" data-state="p7" hidden href="route-record.html">本机路线</a><span class="tool-disabled" data-not-disc="accident">本机路线</span><span class="tool-disabled" data-disc="accident" data-not-state="p7" hidden>本机路线</span><a data-state="p8" hidden href="../ending.html">处理记录</a><span class="tool-disabled" data-not-state="p8">处理记录</span></nav><div class="drive-strip">F:\DCIM\100MEDIA\　FAT32　｜　原卡只读　｜　本机索引可写</div><main class="main" id="main-content"><section data-puzzle-section="p7"><div class="route-title"><div><p class="meta">本机侧车索引 / contact_sheet.csv</p><h2>contact_sheet.csv</h2></div><span>手动排序 / 本机</span></div><div class="contact-sheet" id="sortList"></div><div class="contact-tools"><span class="meta" id="selectedFile">未选中照片</span><button class="plain-button" id="movePrev" type="button">前移</button><button class="plain-button" id="moveNext" type="button">后移</button><button class="plain-button" id="p7submit" type="button">保存联系表</button></div><div class="feedback" id="p7fb"></div><div class="completed-note" data-puzzle-done="p7" hidden="">contact_sheet.csv 已保存（8项）。</div></section></main><footer class="footer">原SD卡只读；contact_sheet.csv 保存在本机整理区。</footer></div><script src="../assets/game.js"></script><script>const pics=[['route_01_stairwell.jpg','DSC_1842.JPG'],['route_02_sink.jpg','DSC_1809.JPG'],['route_03_homework.jpg','DSC_1861.JPG'],['route_04_storefront.jpg','DSC_1817.JPG'],['route_05_busstop.jpg','DSC_1854.JPG'],['route_06_bridge.jpg','DSC_1826.JPG'],['route_07_rain.jpg','DSC_1870.JPG'],['route_08_window.jpg','DSC_1833.JPG']];let order=Game.getDraft('p7order',[3,0,6,2,7,1,5,4]);if(!Array.isArray(order)||order.length!==8)order=[3,0,6,2,7,1,5,4];let selected=-1;const box=document.getElementById('sortList'),label=document.getElementById('selectedFile');function draw(){box.innerHTML='';order.forEach((idx,i)=>{const f=document.createElement('button');f.type='button';f.className='frame';f.innerHTML=`<img src="../assets/img/${pics[idx][0]}" alt="${pics[idx][1]}"><span class="fileline"><span>${pics[idx][1]}</span><span>${i+1}/8</span></span>`;f.onclick=()=>{selected=i;draw()};if(i===selected)f.classList.add('selected');box.appendChild(f)});label.textContent=selected<0?'未选中照片':pics[order[selected]][1]}function move(d){if(selected<0)return;const n=selected+d;if(n<0||n>=order.length)return;[order[selected],order[n]]=[order[n],order[selected]];selected=n;Game.setDraft('p7order',order);draw()}document.getElementById('movePrev').onclick=()=>move(-1);document.getElementById('moveNext').onclick=()=>move(1);draw();function valid(o){const home=new Set(o.slice(0,4));return [0,1,2,7].every(x=>home.has(x))&&o[4]===3&&o[5]===4&&o[6]===5&&o[7]===6}document.getElementById('p7submit').onclick=()=>{const ok=valid(order),f=document.getElementById('p7fb');f.className='feedback show '+(ok?'good':'bad');f.textContent=ok?'contact_sheet.csv 已保存到本机整理区。':'无法保存：照片位置序列存在不连续项。';if(ok){Game.setDraft('p7order',order);Game.complete('p7','《从家到桥头》联系表顺序已恢复')}};</script></body></html>
