<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照片联系表｜SD卡只读索引</title><link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/route.css"></head><body class="route-page" data-puzzles="p7"><div class="viewerapp"><header class="bar"><h1>《从家到桥头》· SD卡只读索引</h1><div class="meta">8张JPEG / 原卡只读</div></header><nav class="tools"><a href="../index.html" data-return-home>返回白鸽音像</a><a href="index.html">目录</a><a href="contact.html" class="current">联系表</a><a href="viewer.html">照片查看</a><a href="road-notice.html">道路附件</a><a href="route-record.html">路线登记</a><a href="../ending.html">U-04档案</a></nav><main class="main" id="main-content"><section data-puzzle-section="p7"><div class="route-title"><div><p class="meta">照片联系表</p><h2>恢复拍摄顺序</h2></div><span>选择照片后前移 / 后移</span></div><div id="sortList" class="contact-sheet"></div><div class="contact-tools"><span class="meta" id="selectedFile">未选中照片</span><button class="plain-button" id="movePrev" type="button">前移</button><button class="plain-button" id="moveNext" type="button">后移</button><button class="plain-button" id="p7submit" type="button">保存联系表</button></div><div id="p7fb" class="feedback"></div><div class="completed-note" data-puzzle-done="p7" hidden>联系表已保存。家中三张内部顺序未登记；同目录附件状态已更新。</div></section></main><footer class="footer">只读导出副本；原SD卡仍随U-04保存。</footer></div><script src="../assets/game.js"></script><script>const pics=[['route_01_stairwell.jpg'],['route_02_sink.jpg'],['route_03_homework.jpg'],['route_04_storefront.jpg'],['route_05_busstop.jpg'],['route_06_bridge.jpg'],['route_07_rain.jpg'],['route_08_window.jpg']];let order=Game.getDraft('p7order',[3,0,2,1,5,4,7,6]);if(!Array.isArray(order)||order.length!==8)order=[3,0,2,1,5,4,7,6];let selected=-1;const box=document.getElementById('sortList'),label=document.getElementById('selectedFile');function draw(){box.innerHTML='';order.forEach((idx,i)=>{const f=document.createElement('button');f.type='button';f.className='frame';f.innerHTML=`<img src="../assets/img/${pics[idx][0]}" alt="IMG_${String(idx+1).padStart(4,'0')}.JPG"><span class="fileline"><span>IMG_${String(idx+1).padStart(4,'0')}.JPG</span><span>${i+1}/8</span></span>`;f.onclick=()=>{selected=i;draw()};if(i===selected)f.classList.add('selected');box.appendChild(f)});label.textContent=selected<0?'未选中照片':`IMG_${String(order[selected]+1).padStart(4,'0')}.JPG`}function move(d){if(selected<0)return;const n=selected+d;if(n<0||n>=order.length)return;[order[selected],order[n]]=[order[n],order[selected]];selected=n;Game.setDraft('p7order',order);draw()}document.getElementById('movePrev').onclick=()=>move(-1);document.getElementById('moveNext').onclick=()=>move(1);draw();function valid(o){const home=new Set(o.slice(0,3));return [0,1,2].every(x=>home.has(x))&&o[3]===3&&o[4]===4&&o[5]===5&&o[6]===6&&o[7]===7}document.getElementById('p7submit').onclick=()=>{const ok=valid(order),f=document.getElementById('p7fb');f.className='feedback show '+(ok?'good':'bad');f.textContent=ok?'联系表已保存。':'联系表中仍有空间位置不连续。';if(ok){Game.setDraft('p7order',order);Game.complete('p7','《从家到桥头》联系表顺序已恢复')}};</script></body></html>
