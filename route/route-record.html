<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>本机路线说明｜U-04整理台</title><link href="../assets/css/base.css" rel="stylesheet"/><link href="../assets/css/route.css" rel="stylesheet"/></head><body class="route-page" data-puzzles="p8"><div class="viewerapp"><header class="bar"><h1>U-04 / SD卡只读副本</h1><div class="meta">8张JPEG / 原卡只读</div></header><nav class="tools"><a data-return-home="" href="../index.html">关闭SD卡索引</a><a href="index.html">目录</a><a href="contact.html">本机联系表</a><a href="viewer.html">照片查看</a><a href="road-notice.html">道路资料</a><a class="current" href="route-record.html">本机路线</a><a data-state="p8" hidden href="../ending.html">处理记录</a><span class="tool-disabled" data-not-state="p8">处理记录</span></nav><div class="drive-strip">F:\DCIM\100MEDIA\　FAT32　｜　原卡只读　｜　本机索引可写</div><main class="main" id="main-content"><div data-puzzle-section="p8"><div class="route-title"><div><p class="meta">本机侧车记录</p><h2>route_note.txt</h2></div><span>草稿自动保存</span></div><div class="route-builder"><div class="route-work"><div><h3>可用节点</h3><div class="route-node-bank" id="routeNodeBank"><button data-node="shop" type="button"><span>01</span>白鸽音像</button><button data-node="main" type="button"><span>02</span>人民路主路</button><button data-node="detour" type="button"><span>03</span>东侧临时便道</button><button data-node="busstop" type="button"><span>04</span>公交站北口</button><button data-node="riverside" type="button"><span>05</span>河堤辅路 / 封闭段南口</button><button data-node="bridge" type="button"><span>06</span>桥头</button><button data-node="home" type="button"><span>07</span>许家附近</button></div></div><div class="route-sequence"><h3>当前路线</h3><ol id="routeSequence"></ol><p class="empty-route">尚未加入节点。</p></div></div><div class="route-builder-actions"><button class="plain-button" id="routeUndo" type="button">撤回一步</button><button class="plain-button" id="routeClear" type="button">清空</button><button class="plain-button" id="p8submit" type="button">保存路线说明</button></div><p class="smallprint">地点名称沿用照片联系表和施工附件中的原词；未出现在照片中的环境记录不写入节点。</p></div><div class="feedback" id="p8fb"></div><div class="completed-note" data-puzzle-done="p8" hidden="">路线说明已保存到本机整理区。　<a href="../ending.html">打开U-04处理记录</a></div></div></main><footer class="footer">原SD卡只读保存；联系表、路线登记与参考资料只写入本机整理区。</footer></div><script src="../assets/game.js"></script><script>const routeNames={shop:'白鸽音像',main:'人民路主路',detour:'东侧临时便道',busstop:'公交站北口',riverside:'河堤辅路 / 封闭段南口',bridge:'桥头',home:'许家附近'};let path=Game.getDraft('p8path',Game.get().p8?['home','shop','detour','busstop','bridge']:[]);if(!Array.isArray(path))path=[];if(Game.get().p8)path=['home','shop','detour','busstop','bridge'];const seq=document.getElementById('routeSequence');function render(){if(!seq)return;seq.innerHTML=path.map((n,i)=>`<li><span>${String(i+1).padStart(2,'0')}</span>${routeNames[n]}</li>`).join('');document.querySelector('.empty-route').hidden=path.length>0;document.querySelectorAll('#routeNodeBank button').forEach(b=>{const used=path.includes(b.dataset.node);b.classList.toggle('selected',used);b.disabled=used})}document.querySelectorAll('#routeNodeBank button').forEach(b=>b.onclick=()=>{if(path.length>=6)return;path=[...path,b.dataset.node];Game.setDraft('p8path',path);render()});document.getElementById('routeUndo')?.addEventListener('click',()=>{path=path.slice(0,-1);Game.setDraft('p8path',path);render()});document.getElementById('routeClear')?.addEventListener('click',()=>{path=[];Game.setDraft('p8path',path);render()});render();document.getElementById('p8submit')?.addEventListener('click',()=>{const target=['home','shop','detour','busstop','bridge'],ok=path.length===target.length&&path.every((v,i)=>v===target[i]),f=document.getElementById('p8fb');f.className='feedback show '+(ok?'good':'bad');if(ok){f.textContent='route_note.txt 已保存到本机整理区。';Game.complete('p8','当晚道路条件已核对');const s=Game.get();s.endingReady=true;Game.save()}else{const closed=path.includes('main')||path.includes('riverside');f.textContent=closed?'无法保存：路线经过施工公告标记的封闭段。':'无法保存：当前路线与“从家到桥头”的照片地点顺序不一致。'}});</script></body></html>
