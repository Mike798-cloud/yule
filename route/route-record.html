<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>路线登记｜SD卡只读索引</title><link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/route.css"></head><body class="route-page" data-puzzles="p8"><div class="viewerapp"><header class="bar"><h1>《从家到桥头》· SD卡只读索引</h1><div class="meta">8张JPEG / 原卡只读</div></header><nav class="tools"><a href="../index.html" data-return-home>返回白鸽音像</a><a href="index.html">目录</a><a href="contact.html">联系表</a><a href="viewer.html">照片查看</a><a href="road-notice.html">道路附件</a><a href="route-record.html" class="current">路线登记</a><a href="../ending.html">U-04档案</a></nav><main class="main" id="main-content"><div data-state="p7" hidden data-puzzle-section="p8"><div class="route-title"><div><p class="meta">路线登记</p><h2>根据照片地点与施工公告补路线</h2></div><span>草稿自动保存</span></div><div class="route-builder"><div class="route-work"><div><h3>可用节点</h3><div class="route-node-bank" id="routeNodeBank"><button type="button" data-node="shop"><span>01</span>白鸽音像</button><button type="button" data-node="main"><span>02</span>人民路主路</button><button type="button" data-node="detour"><span>03</span>东侧临时便道</button><button type="button" data-node="busstop"><span>04</span>公交站北口</button><button type="button" data-node="riverside"><span>05</span>河堤辅路 / 封闭段南口</button><button type="button" data-node="bridge"><span>06</span>桥头</button><button type="button" data-node="home"><span>07</span>许家附近</button></div></div><div class="route-sequence"><h3>当前路线</h3><ol id="routeSequence"></ol><p class="empty-route">尚未加入节点。</p></div></div><div class="route-builder-actions"><button class="plain-button" id="routeUndo" type="button">撤回一步</button><button class="plain-button" id="routeClear" type="button">清空</button><button class="plain-button" id="p8submit" type="button">保存道路说明</button></div><p class="smallprint">联系人地址只按“许家附近”记录。天气与停电是风险条件，不作为路线节点。</p></div><div class="feedback" id="p8fb"></div><div class="completed-note" data-puzzle-done="p8" hidden>道路说明已保存。<br><a href="../ending.html">返回U-04处理记录</a></div></div><div data-not-state="p7"><p>联系表尚未保存。</p></div></main><footer class="footer">只读导出副本；原SD卡仍随U-04保存。</footer></div><script src="../assets/game.js"></script><script>const routeNames={shop:'白鸽音像',main:'人民路主路',detour:'东侧临时便道',busstop:'公交站北口',riverside:'河堤辅路 / 封闭段南口',bridge:'桥头',home:'许家附近'};let path=Game.getDraft('p8path',Game.get().p8?['shop','detour','busstop','bridge','home']:[]);if(!Array.isArray(path))path=[];if(Game.get().p8)path=['shop','detour','busstop','bridge','home'];const seq=document.getElementById('routeSequence');function render(){if(!seq)return;seq.innerHTML=path.map((n,i)=>`<li><span>${String(i+1).padStart(2,'0')}</span>${routeNames[n]}</li>`).join('');document.querySelector('.empty-route').hidden=path.length>0;document.querySelectorAll('#routeNodeBank button').forEach(b=>{const used=path.includes(b.dataset.node);b.classList.toggle('selected',used);b.disabled=used})}document.querySelectorAll('#routeNodeBank button').forEach(b=>b.onclick=()=>{if(path.length>=6)return;path=[...path,b.dataset.node];Game.setDraft('p8path',path);render()});document.getElementById('routeUndo')?.addEventListener('click',()=>{path=path.slice(0,-1);Game.setDraft('p8path',path);render()});document.getElementById('routeClear')?.addEventListener('click',()=>{path=[];Game.setDraft('p8path',path);render()});render();document.getElementById('p8submit')?.addEventListener('click',()=>{const target=['shop','detour','busstop','bridge','home'],ok=path.length===target.length&&path.every((v,i)=>v===target[i]),f=document.getElementById('p8fb');f.className='feedback show '+(ok?'good':'bad');if(ok){f.textContent='道路说明已保存。';Game.complete('p8','当晚道路条件已核对');const s=Game.get();s.endingReady=true;Game.save()}else{const closed=path.includes('main')||path.includes('riverside');f.textContent=closed?'当前路线经过公告标记的封闭段。':'当前节点顺序还不能同时解释白鸽门口、公交站、桥头和回家方向。'}});</script></body></html>
